<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 144">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="25%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="busBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="windshield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="65%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="iconShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#312e81" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Left Square Emblem (scaled from 512 to 116x116 at x=14, y=14) -->
  <g transform="translate(14, 14) scale(0.2265625)" filter="url(#iconShadow)">
    <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
    <rect width="512" height="512" rx="120" fill="url(#topGlow)"/>
    <circle cx="248" cy="264" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="5"/>
    <ellipse cx="248" cy="408" rx="126" ry="18" fill="#1e1b4b" fill-opacity="0.32"/>

    <rect x="96" y="186" width="22" height="46" rx="10" fill="#c7d2fe"/>
    <rect x="378" y="186" width="22" height="46" rx="10" fill="#c7d2fe"/>
    <rect x="144" y="346" width="44" height="54" rx="16" fill="#1e1b4b"/>
    <rect x="308" y="346" width="44" height="54" rx="16" fill="#1e1b4b"/>
    <rect x="122" y="124" width="252" height="248" rx="46" fill="url(#busBody)"/>
    <rect x="182" y="142" width="132" height="20" rx="10" fill="#312e81"/>
    <rect x="200" y="148" width="96" height="8" rx="4" fill="#fbbf24"/>
    <rect x="144" y="176" width="208" height="106" rx="22" fill="url(#windshield)"/>
    <path d="M168 176 L210 176 L166 282 L144 282 L144 232 Z" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="168" cy="326" r="18" fill="#fbbf24"/>
    <circle cx="168" cy="326" r="9" fill="#fef3c7"/>
    <circle cx="328" cy="326" r="18" fill="#fbbf24"/>
    <circle cx="328" cy="326" r="9" fill="#fef3c7"/>
    <rect x="208" y="316" width="80" height="8" rx="4" fill="#818cf8"/>
    <rect x="220" y="332" width="56" height="8" rx="4" fill="#a5b4fc"/>

    <rect x="364" y="58" width="36" height="16" rx="7" fill="#ffffff"/>
    <rect x="376" y="70" width="12" height="16" fill="#ffffff"/>
    <circle cx="382" cy="144" r="66" fill="url(#amberGrad)" stroke="#ffffff" stroke-width="12"/>
    <polyline points="382,108 382,146 409,160" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="382" cy="146" r="8" fill="#ffffff"/>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(152, 0)">
    <text
      x="0"
      y="84"
      font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="74"
      font-weight="900"
      letter-spacing="4"
      fill="url(#textGrad)"
    >WIMB<tspan fill="url(#amberGrad)">Y</tspan></text>

    <!-- Subtitle -->
    <text
      x="4"
      y="115"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="18"
      font-weight="700"
      letter-spacing="2.8"
      fill="#64748b"
    >WHERE IS MY BUS<tspan fill="#ea580c" font-weight="900">?!</tspan></text>
  </g>
</svg>
